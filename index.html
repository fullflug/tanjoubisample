<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mio</title>
    <!-- Google Fonts: Sawarabi Mincho for elegance, Pinyon Script for Western aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Sawarabi+Mincho&family=Zen+Old+Mincho:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    </div>
    <!-- Background overlay for noise/texture if needed -->

    <div class="noise-overlay"></div>

    <!-- CSS Background Layer -->
    <div class="bg-container"></div>



    <main class="container">
        <!-- Hero Section -->
        <section id="hero" class="hero-section">

            <div class="hero-content sweets-decoration">
                <p class="sub-title">Happy Birthday</p>
                <div class="chocolate-layout">
                    <h1 class="main-title chocolate-plate">誕生日おめでとう！</h1>
                    <h2 class="name chocolate-plate">みお</h2>
                </div>
                <div class="date-badge">2026.04.13</div>
            </div>
        </section>

        <!-- Message Section -->
        <section id="message" class="content-section">
            <div class="frame-container">
                <div class="ribbon-top"></div>
                <h3 class="section-title">Message</h3>
                <p class="message-text">
                    19歳お誕生日おめでとう！<br>
                    去年はいっぱい旅行にいけて楽しかったね！
                </p>

                <div class="main-image-container" style="margin-top: 40px;">
                    <img src="main_visual.png" alt="Happy Birthday Illustration" class="main-visual">
                </div>

                <div class="ribbon-bottom"></div>
            </div>
        </section>

        <!-- Album Section -->
        <section id="album" class="content-section">
            <h3 class="section-title">Album</h3>
            <div class="photo-grid">
                <div class="photo-card skew-left">
                    <div class="tape"></div>
                    <div class="photo-inner">
                        <img src="memory_1.jpg" alt="Memory 1" class="main-visual">
                    </div>
                    <div class="handwritten">Memory 1</div>
                </div>
                <div class="photo-card skew-right">
                    <div class="tape"></div>
                    <div class="photo-inner">
                        <img src="memory_2.jpg" alt="Memory 2" class="main-visual">
                    </div>
                    <div class="handwritten">Memory 2</div>
                </div>
                <div class="photo-card skew-center">
                    <div class="tape"></div>
                    <div class="photo-inner">
                        <img src="memory_3.jpg" alt="Memory 3" class="main-visual">
                    </div>
                    <div class="handwritten">Memory 3</div>
                </div>
                <div class="photo-card skew-left">
                    <div class="tape"></div>
                    <div class="photo-inner">
                        <img src="memory_4.jpg" alt="Memory 4" class="main-visual">
                    </div>
                    <div class="handwritten">Memory 4</div>
                </div>
                <div class="photo-card skew-right">
                    <div class="tape"></div>
                    <div class="photo-inner">
                        <img src="memory_5.jpg" alt="Memory 5" class="main-visual">
                    </div>
                    <div class="handwritten">Memory 5</div>
                </div>
            </div>
        </section>


    </main>

    <audio id="bgm" controls style="display:none;">
        <source src="maou_14_shining_star.mp3" type="audio/mpeg">
        お使いのブラウザは audio タグをサポートしていません。
    </audio>

    <!-- Music Toggle Button with Tooltip -->
    <div class="music-container">
        <div id="music-tooltip" class="music-tooltip">音楽がなるよ！</div>
        <button id="music-toggle" class="music-btn" aria-label="Toggle Music">▶</button>
    </div>

    <!-- Lightbox for Album Photos (Polaroid Style) -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-wrapper">
            <span class="close-lightbox">&times;</span>
            <div id="lightbox-container" class="lightbox-content-container"></div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Happy Birthday Mio</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
